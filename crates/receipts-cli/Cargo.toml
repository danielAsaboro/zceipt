[package]
name = "receipts-cli"
version = "0.1.0"
description = "Create and verify Zcash payment receipts (ZIP 311) from the command line"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "receipts"
path = "src/main.rs"

[dependencies]
receipts-core = { path = "../receipts-core" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.21", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
hex = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
age = { version = "0.12", features = ["armor"] }
bip0039 = "0.12"
secrecy = "0.8"
rusqlite = "0.37"
rand = "0.8"
orchard.workspace = true
incrementalmerkletree = "0.8"
shardtree = "0.7"
zcash_client_backend = { version = "0.24.0", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard"] }
zcash_client_sqlite = { version = "0.22.0", features = ["orchard"] }
zcash_keys = { version = "0.16.1", features = ["orchard"] }
zcash_primitives = "0.30.0"
zcash_protocol = "0.10.3"
zcash_address = "0.13.0"
zip32 = "0.2"
zcash_note_encryption.workspace = true
