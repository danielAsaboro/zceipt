[workspace]
members = ["crates/receipts-core", "crates/receipts-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/danielAsaboro/zecathon-receipts"

[workspace.dependencies]
orchard = { version = "0.15.5", default-features = false, features = ["circuit", "std"] }
zcash_note_encryption = "0.4.2"
pasta_curves = "0.5.2"
ff = "0.13"
group = "0.13"
rand = { version = "0.8", default-features = false }
rand_core = { version = "0.6", default-features = false }
blake2b_simd = "1"
thiserror = "2"
base64 = "0.22"

[profile.release]
lto = "thin"

[profile.test]
opt-level = 3
