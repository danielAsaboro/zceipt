name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace --release --locked
      - run: cargo clippy --workspace --release --locked -- -D warnings
      - run: ./scripts/check-stock-orchard.sh
      - run: cargo build --release --locked -p zceipt-cli
      - run: ZCEIPT=target/release/zceipt ./scripts/check-all.sh
  circuits:
    # The claim and sibling circuits are pinned by verifying-key fingerprints; the vendored patch must
    # reproduce vendor/orchard exactly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: ./scripts/check-vendor-patch.sh
      - run: ./scripts/test-vendored-orchard.sh
      - run: cargo test --release --locked -p zceipt-kce --lib -- --ignored pinned
  spec-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s spec-verifier/tests
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: cd packages/zceipt && node --test test/*.test.js
  python-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "1.26" }
      - run: cd packages/zceipt-python && python3 -m unittest discover -s tests
      - run: cd packages/zceipt-go && go test ./...
  fuzz:
    # Nightly: each decoder target for five minutes, from the committed corpus.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [decode_receipt, decode_batch, decode_sign_in, decode_text]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - run: cargo install cargo-fuzz --locked
      - run: cd crates/zceipt-core/fuzz && cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300
