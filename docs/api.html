<script>
// Tiny Markdown renderer (headings, code, tables, lists, links, inline code, bold).
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"})[c])}
function inline(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,t,u)=>`<a href="${u.endsWith('.md')&&!u.startsWith('http')?'#'+u.replace(/^\/docs\//,'').replace(/^\.\.\//,''):u}">${t}</a>`).replace(/&lt;a id="([a-z_]+)"&gt;&lt;\/a&gt;/g,'<a id="$1"></a>')}
function md(src){const L=src.split("\n");let o="",i=0;while(i<L.length){let l=L[i];if(l.startsWith("```")){let b=[];i++;while(i<L.length&&!L[i].startsWith("```"))b.push(L[i++]);i++;o+=`<pre>${esc(b.join("\n"))}</pre>`;continue}
const h=l.match(/^(#{1,3}) (.*)/);if(h){o+=`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;i++;continue}
if(l.startsWith("|")){let r=[];while(i<L.length&&L[i].startsWith("|"))r.push(L[i++]);r=r.filter(x=>!/^\|[-| ]+\|$/.test(x));o+="<table>"+r.map((x,j)=>"<tr>"+x.slice(1,-1).split("|").map(c=>`<${j?"td":"th"}>${inline(c.trim())}</${j?"td":"th"}>`).join("")+"</tr>").join("")+"</table>";continue}
if(/^(- |\d+\. )/.test(l)){let r=[];while(i<L.length&&/^(- |\d+\. |   )/.test(L[i]))r.push(L[i++]);o+="<ul>"+r.map(x=>`<li>${inline(x.replace(/^(- |\d+\. |   )/,""))}</li>`).join("")+"</ul>";continue}
if(l.trim()){let r=[];while(i<L.length&&L[i].trim()&&!/^(#|```|\||- |\d+\. )/.test(L[i]))r.push(L[i++]);o+=`<p>${inline(r.join(" "))}</p>`;continue}i++}return o}
async function show(){const name=(location.hash.slice(1)||"QUICKSTART.md");const r=await fetch("/docs/"+name);document.getElementById("doc").innerHTML=r.ok?md(await r.text()):"Not found"}
addEventListener("hashchange",show);show();
</script></body></html>
