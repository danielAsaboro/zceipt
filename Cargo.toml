[workspace]
members = ["crates/receipts-core", "crates/receipts-chain", "crates/receipts-server", "crates/receipts-client", "crates/receipts-cli", "crates/receipts-wallet", "crates/receipts-wasm", "crates/receipts-ffi"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/danielAsaboro/zecathon-receipts"

[workspace.dependencies]
orchard = { version = "0.16", default-features = false, features = ["circuit", "std"] }
zcash_note_encryption = "0.5.1"
pasta_curves = "0.6"
ff = "0.14"
group = "0.14"
rand = { version = "0.10", default-features = false }
rand_core = { version = "0.10", default-features = false }
blake2b_simd = "1"
thiserror = "2"
base64 = "0.22"

# librustzcash main: the first revision with the NU6.3 upgrade (Ironwood; librustzcash names it NU7). Upstreaming: DEVELOPERS.md.
zcash_primitives = { git = "https://github.com/zcash/librustzcash.git", rev = "9e3b2e15d0f7042d42106276830e3e8e0c0165c6", default-features = false }
zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "9e3b2e15d0f7042d42106276830e3e8e0c0165c6" }
zcash_address = { git = "https://github.com/zcash/librustzcash.git", rev = "9e3b2e15d0f7042d42106276830e3e8e0c0165c6" }
zcash_keys = { git = "https://github.com/zcash/librustzcash.git", rev = "9e3b2e15d0f7042d42106276830e3e8e0c0165c6" }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash.git", rev = "9e3b2e15d0f7042d42106276830e3e8e0c0165c6" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash.git", rev = "9e3b2e15d0f7042d42106276830e3e8e0c0165c6" }
zip321 = { git = "https://github.com/zcash/librustzcash.git", rev = "9e3b2e15d0f7042d42106276830e3e8e0c0165c6" }
zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash.git", rev = "9e3b2e15d0f7042d42106276830e3e8e0c0165c6" }

[profile.release]
lto = "thin"

[profile.test]
opt-level = 3


# orchard 0.16.0 from crates.io plus a ~60-line patch (vendor/orchard-0.16.0-receipts.patch):
# precomputed verifier parameters, and a few note/address accessors made public for incoming
# receipts and memo-withheld outputs. No circuit change. See vendor/README.md.
[patch.crates-io]
orchard = { path = "vendor/orchard" }
