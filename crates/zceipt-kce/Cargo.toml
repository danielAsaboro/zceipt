[package]
name = "zceipt-kce"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sibling-account proofs: two payer tags come from accounts of one ZIP 32 wallet"

[dependencies]
ff.workspace = true
halo2_proofs = { version = "0.4", default-features = false, features = ["batch", "floor-planner-v1-legacy-pdqsort"] }
halo2_gadgets = { version = "0.6", default-features = false }
pasta_curves.workspace = true
num-bigint = "0.4"
blake2b_simd = "1"
hex = "0.4"
base64 = "0.22"
rand = { workspace = true, features = ["std", "sys_rng"] }


[dev-dependencies]
regex = "1"
orchard.workspace = true
zip32 = "0.3"
