  <link rel="stylesheet" href="./zceipt.css">
  <style>
    main { max-width: 640px; margin: 0 auto; padding: 116px 16px 80px; }
    h1 { font-size: clamp(36px, 5vw, 52px); margin: 18px 0 26px; }
    h2 { font-size: 20px; letter-spacing: -.03em; margin: 0 0 4px; }
    .island { padding: 24px; }
    .island + .island { margin-top: 14px; }
    label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); margin: 14px 0 6px; }
    label:first-child { margin-top: 0; }
    input, textarea { width: 100%; background: rgba(255,255,255,.6); box-shadow: inset 0 1px 2px rgba(17,17,20,.06), inset 0 0 0 1px rgba(17,17,20,.06); color: var(--ink); border: 1px solid transparent; border-radius: var(--r-input); padding: 12px 14px; font: 13px var(--mono); transition: border-color .2s, box-shadow .2s, background .2s; }
    input:focus, textarea:focus { outline: none; background: var(--surface); border-color: rgba(0,113,227,.45); box-shadow: 0 0 0 4px rgba(0,113,227,.12); }
    textarea { min-height: 84px; resize: vertical; }
    .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    button { font: 600 15px var(--sans); border: 0; border-radius: 999px; padding: 13px 22px; cursor: pointer; background: var(--ink); color: #fff; margin-top: 18px; transition: transform .2s var(--out); }
    button:hover { transform: translateY(-1px); }
    button.ghost { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line-2) inset; margin-left: 6px; }
    button:disabled { opacity: 0.5; cursor: default; transform: none; }
    #progress { font: 12.5px/1.6 var(--mono); color: var(--ink-2); margin: 14px 4px 0; white-space: pre-wrap; }
    select { width: 100%; background: rgba(255,255,255,.6); color: var(--ink); border: 1px solid transparent; border-radius: var(--r-input); padding: 12px 14px; font: 13px var(--sans); box-shadow: inset 0 0 0 1px rgba(17,17,20,.06); }
    button.mm { width: 100%; margin: 0; }
    .or { display: flex; align-items: center; gap: 12px; color: var(--ink-2); font-size: 13px; margin: 18px 0 2px; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
    label.check { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink); margin-top: 16px; cursor: pointer; }
    label.check input { width: 18px; height: 18px; margin: 0; padding: 0; accent-color: var(--ink); box-shadow: none; }
    #payments { display: grid; gap: 8px; margin-top: 14px; }
    .pay { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; text-align: left; width: 100%; margin: 0; padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,.55); color: var(--ink); box-shadow: inset 0 0 0 1px rgba(17,17,20,.06); font: 500 15px var(--sans); }
    .pay:hover { transform: none; background: var(--surface); }
    .pay[aria-checked="true"] { background: var(--surface); box-shadow: inset 0 0 0 2px var(--accent); }
    .pay small { grid-column: 1 / -1; font: 12px var(--mono); color: var(--ink-2); }
    .pay b { font-weight: 600; font-variant-numeric: tabular-nums; }
    #payments p { margin: 0; color: var(--ink-2); font-size: 14px; }
    #progress:empty { display: none; }
    #progress .err { color: var(--bad); }
    .done { color: var(--accent); }
    @media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
  <nav class="island-nav" data-lens="14">
    <a class="logo" href="/"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><defs><linearGradient id="zlb" x1="16" y1="2" x2="16" y2="28" gradientUnits="userSpaceOnUse"><stop stop-color="#2C2C34"/><stop offset="1" stop-color="#0D0D10"/></linearGradient><linearGradient id="zlr" x1="22" y1="9" x2="10" y2="21" gradientUnits="userSpaceOnUse"><stop stop-color="#4AA8FF"/><stop offset="1" stop-color="#0066D6"/></linearGradient></defs><path d="M10.5 3h11a4.5 4.5 0 0 1 4.5 4.5v19.2l-2.6-1.8-2.6 1.8-2.6-1.8-2.6 1.8-2.6-1.8-2.6 1.8-2.6-1.8-2.6 1.8V7.5A4.5 4.5 0 0 1 10.5 3z" fill="url(#zlb)" stroke="url(#zlb)" stroke-width="1.2" stroke-linejoin="round"/><path d="M10.6 3.6h10.8" stroke="#fff" stroke-opacity=".22" stroke-width=".8" stroke-linecap="round"/><path d="M11 9.8h10M11 19.8h10" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M21 9.8l-10 10" stroke="url(#zlr)" stroke-width="2.6" stroke-linecap="round"/></svg>Zceipt</a>
    <div class="links"><a href="/docs/">Docs</a></div>
    <a class="btn small ghost" href="./">Verify</a>
  </nav>
  <main>
    <span class="pill"><i class="dot accent"></i>Keys stay on this device</span>
    <h1>Make a receipt</h1>

    <section class="island" id="unlockPart" hidden>
      <h2 id="savedLabel"></h2>
      <button id="unlockBtn">Unlock with passkey</button>
      <button type="button" class="ghost" id="otherBtn">Forget this wallet</button>
    </section>

    <section class="island" id="openPart">
      <button type="button" id="mmBtn" class="mm">Connect MetaMask</button>
      <div class="or" id="mmOr"><span>or</span></div>
      <label for="key">Seed phrase or viewing key</label>
      <textarea id="key" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      <div class="two">
        <div><label for="birthday">Wallet birthday (block)</label><input id="birthday" inputmode="numeric" autocomplete="off"></div>
        <div id="netBox" hidden><label for="net">Network</label><select id="net"><option value="test">Testnet</option><option value="main">Mainnet</option></select></div>
      </div>
      <label class="check" id="rememberBox" hidden><input type="checkbox" id="remember"> Remember on this device with a passkey</label>
      <button id="openBtn">Open wallet</button>
    </section>

    <section class="island" id="pickPart" hidden>
      <h2>Which payment?</h2>
      <div id="payments" role="radiogroup" aria-label="Payments from this wallet"></div>
      <label for="msg">Message</label>
      <input id="msg" autocomplete="off" placeholder="Invoice 42">
      <button id="makeBtn" disabled>Make receipt</button>
    </section>

    <section id="signPart" class="island" hidden>
      <h2>Sign it</h2>
      <label for="phrase">Seed phrase</label>
      <textarea id="phrase" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      <button id="signBtn">Sign</button>
      <button type="button" class="ghost" id="saveBtn">Sign elsewhere</button>
    </section>

    <div id="progress" role="status" aria-live="polite"></div>
  </main>
  <script src="./glass.js" defer></script>
  <script type="module" src="./make.js"></script>
</body>
</html>
