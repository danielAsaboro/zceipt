[package]
name = "receipts-core"
version = "0.1.0"
description = "ZIP 311 payment disclosures (receipts) for Zcash Orchard and Ironwood"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Needs the small orchard patch in vendor/ (see vendor/README.md): incoming receipts, outputs
# with the memo withheld (format v5), and precomputed verifier parameters (about 3x faster key
# building). Without it receipts-core builds on stock orchard 0.16, and receipts that use those
# features are refused with Error::NeedsOrchardExt.
orchard-ext = []

[dependencies]
orchard.workspace = true
zcash_note_encryption.workspace = true
pasta_curves.workspace = true
ff.workspace = true
group.workspace = true
rand.workspace = true
rand_core.workspace = true
blake2b_simd.workspace = true
thiserror.workspace = true
base64.workspace = true
incrementalmerkletree = "0.9"
zip321.workspace = true
zcash_primitives.workspace = true
zcash_transparent.workspace = true
zcash_address.workspace = true
zcash_protocol.workspace = true
qrcode = { version = "0.14", default-features = false }
serde_json = "1"

[dev-dependencies]
receipts-core = { path = ".", features = ["orchard-ext"] }
halo2_proofs = { version = "0.4", default-features = false }
rand = { version = "0.10", features = ["std", "sys_rng"] }
incrementalmerkletree = "0.9"
shardtree = "0.8"

[[example]]
name = "write_params"
required-features = ["orchard-ext"]
