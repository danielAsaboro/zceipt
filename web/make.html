<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Make a receipt · Zceipt</title>
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23111114'/><path d='M10.5 10.5h11l-11 11h11' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linejoin='round' stroke-linecap='round'/><circle cx='24' cy='8' r='3.2' fill='%235B3DF5'/></svg>">
  <link rel="stylesheet" href="./zceipt.css">
  <style>
    main { max-width: 640px; margin: 0 auto; padding: 116px 16px 80px; }
    h1 { font-size: clamp(36px, 5vw, 52px); margin: 18px 0 26px; }
    h2 { font-size: 20px; letter-spacing: -.03em; margin: 0 0 4px; }
    .island { padding: 24px; }
    .island + .island { margin-top: 14px; }
    label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); margin: 14px 0 6px; }
    label:first-child { margin-top: 0; }
    input, textarea { width: 100%; background: var(--sunk); color: var(--ink); border: 1px solid transparent; border-radius: var(--r-input); padding: 12px 14px; font: 13px var(--mono); transition: border-color .2s, box-shadow .2s, background .2s; }
    input:focus, textarea:focus { outline: none; background: var(--surface); border-color: rgba(91,61,245,.45); box-shadow: 0 0 0 4px rgba(91,61,245,.12); }
    textarea { min-height: 84px; resize: vertical; }
    .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    button { font: 600 15px var(--sans); border: 0; border-radius: 999px; padding: 13px 22px; cursor: pointer; background: var(--ink); color: #fff; margin-top: 18px; transition: transform .2s var(--out); }
    button:hover { transform: translateY(-1px); }
    button.ghost { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line-2) inset; margin-left: 6px; }
    button:disabled { opacity: 0.5; cursor: default; transform: none; }
    #progress { font: 12.5px/1.6 var(--mono); color: var(--ink-2); margin-top: 14px; white-space: pre-wrap; }
    #progress:empty { display: none; }
    #progress .err { color: var(--bad); }
    .done { color: var(--iris); }
    @media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i></div>
  <nav class="island-nav">
    <a class="logo" href="/"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#111114"/><path d="M10.5 10.5h11l-11 11h11" stroke="#fff" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="24" cy="8" r="3.2" fill="#5B3DF5"/></svg>Zceipt</a>
    <div class="links"><a href="/docs/">Docs</a></div>
    <a class="btn small ghost" href="./">Verify</a>
  </nav>
  <main>
    <span class="pill"><i class="dot iris"></i>Proofs made on this device</span>
    <h1>Make a receipt</h1>
    <div class="island">

    <label for="ufvk">Your wallet's viewing key (uview1… or uviewtest1…)</label>
    <textarea id="ufvk" spellcheck="false" autocomplete="off"></textarea>
    <label for="txid">The payment's transaction id</label>
    <input id="txid" spellcheck="false" autocomplete="off" placeholder="64 hex digits, from your wallet's history">
    <div class="two">
      <div><label for="birthday">Wallet birthday (block height)</label><input id="birthday" inputmode="numeric" autocomplete="off"></div>
      <div><label for="msg">Message</label><input id="msg" autocomplete="off" placeholder="Invoice 42"></div>
    </div>
    <button id="proveBtn">Make the proofs</button>
    <div id="progress" role="status" aria-live="polite"></div>
    </div>

    <section id="signPart" class="island" hidden>
      <h2>Sign it</h2>
      <label for="phrase">Your seed phrase (typed here, used once, never stored or sent)</label>
      <textarea id="phrase" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      <button id="signBtn">Sign</button>
      <button type="button" class="ghost" id="saveBtn">Sign elsewhere instead</button>
    </section>
  </main>
  <script type="module" src="./make.js"></script>
</body>
</html>
