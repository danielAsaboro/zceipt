<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Make a receipt · Zceipt</title>
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark">
  <style>
    :root { color-scheme: dark; --desk: #121110; --desk-2: #1b1a18; --paper: #f3efe4; --ink: #161513; --text: #ebe7dd; --text-2: #a39d90; --good: #3f9b6c; --bad: #e0796f;
      --mono: ui-monospace, "SF Mono", Menlo, monospace; --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--desk); color: var(--text); font-family: var(--sans); }
    main { max-width: 640px; margin: 0 auto; padding: 40px 16px 80px; }
    a { color: inherit; }
    h1 { font-size: 34px; margin: 0 0 22px; letter-spacing: -0.02em; }
    h2 { font-size: 15px; margin: 28px 0 10px; color: var(--paper); }
    label { display: block; font-size: 13px; color: var(--text-2); margin: 14px 0 6px; }
    input, textarea { width: 100%; background: var(--desk-2); color: var(--text); border: 1px solid #2c2a26; border-radius: 10px; padding: 12px 14px; font: 13px var(--mono); }
    textarea { min-height: 76px; resize: vertical; }
    .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    button { font: 600 15px var(--sans); border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; background: var(--paper); color: var(--ink); margin-top: 16px; }
    button.ghost { background: transparent; color: var(--text); border: 1px solid #3a372f; }
    button:disabled { opacity: 0.5; cursor: default; }
    #progress { font: 12.5px var(--mono); color: var(--text-2); margin-top: 14px; white-space: pre-wrap; }
    #progress .err { color: var(--bad); }
    .done { color: var(--good); }
    .crumb { font: 12px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-2); margin-bottom: 14px; }
    .crumb a { text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="crumb"><a href="./">Zceipt</a></div>
    <h1>Make a receipt</h1>

    <label for="ufvk">Your wallet's viewing key (uview1… or uviewtest1…)</label>
    <textarea id="ufvk" spellcheck="false" autocomplete="off"></textarea>
    <label for="txid">The payment's transaction id</label>
    <input id="txid" spellcheck="false" autocomplete="off" placeholder="64 hex digits, from your wallet's history">
    <div class="two">
      <div><label for="birthday">Wallet birthday (block height)</label><input id="birthday" inputmode="numeric" autocomplete="off"></div>
      <div><label for="msg">Message</label><input id="msg" autocomplete="off" placeholder="Invoice 42"></div>
    </div>
    <button id="proveBtn">Make the proofs</button>
    <div id="progress" role="status" aria-live="polite"></div>

    <section id="signPart" hidden>
      <h2>Sign it</h2>
      <label for="phrase">Your seed phrase (typed here, used once, never stored or sent)</label>
      <textarea id="phrase" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      <button id="signBtn">Sign</button>
      <button type="button" class="ghost" id="saveBtn">Sign elsewhere instead</button>
    </section>
  </main>
  <script type="module" src="./make.js"></script>
</body>
</html>
