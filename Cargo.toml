[workspace]
members = ["crates/receipts-core", "crates/receipts-chain", "crates/receipts-server", "crates/receipts-client", "crates/receipts-cli", "crates/receipts-wasm"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/danielAsaboro/zecathon-receipts"

[workspace.dependencies]
orchard = { version = "0.16", default-features = false, features = ["circuit", "std"] }
zcash_note_encryption = "0.5.1"
pasta_curves = "0.6"
ff = "0.14"
group = "0.14"
rand = { version = "0.10", default-features = false }
rand_core = { version = "0.10", default-features = false }
blake2b_simd = "1"
thiserror = "2"
base64 = "0.22"

# librustzcash main: the first revision that knows NU7 (testnet, Oct 2026; mainnet Nov 5).
zcash_primitives = { git = "https://github.com/zcash/librustzcash.git", rev = "9e3b2e15d0f7042d42106276830e3e8e0c0165c6", default-features = false }
zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "9e3b2e15d0f7042d42106276830e3e8e0c0165c6" }
zcash_address = { git = "https://github.com/zcash/librustzcash.git", rev = "9e3b2e15d0f7042d42106276830e3e8e0c0165c6" }
zcash_keys = { git = "https://github.com/zcash/librustzcash.git", rev = "9e3b2e15d0f7042d42106276830e3e8e0c0165c6" }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash.git", rev = "9e3b2e15d0f7042d42106276830e3e8e0c0165c6" }
zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash.git", rev = "9e3b2e15d0f7042d42106276830e3e8e0c0165c6" }

[profile.release]
lto = "thin"

[profile.test]
opt-level = 3

