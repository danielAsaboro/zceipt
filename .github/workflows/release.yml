name: release
# On a version tag: build the zceipt CLI for Linux and macOS and attach it, with SHA-256
# checksums, to the GitHub release, so making or verifying a receipt needs no Rust toolchain.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p zceipt-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=zceipt-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name" && cp target/${{ matrix.target }}/release/zceipt* README.md LICENSE* "$name"/ && rm -f "$name"/zceipt.d "$name"/zceipt.pdb
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: zceipt-*.tar.gz*
