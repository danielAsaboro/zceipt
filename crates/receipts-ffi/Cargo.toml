[package]
name = "receipts-ffi"
version = "0.1.0"
description = "Swift and Kotlin bindings (uniffi) for Zcash payment receipts: verify, and sign a prepared receipt"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "receipts_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
receipts-core = { path = "../receipts-core", features = ["orchard-ext", "extensions"] }
receipts-chain = { path = "../receipts-chain" }
orchard.workspace = true
rand = { workspace = true, features = ["std", "sys_rng"] }
serde_json = "1"
thiserror = "2"
uniffi = { version = "0.29", features = ["cli"] }
